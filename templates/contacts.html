{% extends "base.html" %}

{% block title %}Contacts - Job Tracker{% endblock %}

{% block content %}
<h2>Manage Contacts</h2>

<section>
    <h3>Add New Contact</h3>
    <form method="POST">
        <input type="text" name="contact_name" placeholder="Contact Name" required>
        <input type="email" name="email" placeholder="Email">
        <input type="text" name="phone" placeholder="Phone">
        <select name="company_id" required>
            <option value="">-- Select Company --</option>
            {% for comp in companies %}
                <option value="{{ comp.company_id }}">{{ comp.company_name }}</option>
            {% endfor %}
        </select>
        <button type="submit">Add Contact</button>
    </form>
</section>

<hr>

<section>
    <h3>Existing Contacts</h3>
    <table border="1" style="width:100%; border-collapse: collapse;">
        <thead>
            <tr style="background-color: #f2f2f2;">
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Company</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for contact in contacts %}
            <tr>
                <td>
                    <input type="text" name="contact_name" value="{{ contact.contact_name }}" form="edit-form-{{ contact.contact_id }}" required>
                </td>
                <td>
                    <input type="email" name="email" value="{{ contact.email }}" form="edit-form-{{ contact.contact_id }}">
                </td>
                <td>
                    <input type="text" name="phone" value="{{ contact.phone }}" form="edit-form-{{ contact.contact_id }}">
                </td>
                <td>
                    <select name="company_id" form="edit-form-{{ contact.contact_id }}" required>
                        {% for comp in companies %}
                            <option value="{{ comp.company_id }}" {% if comp.company_id == contact.company_id %}selected{% endif %}>
                                {{ comp.company_name }}
                            </option>
                        {% endfor %}
                    </select>
                </td>
                <td>
                    <form id="edit-form-{{ contact.contact_id }}" action="{{ url_for('edit_contact', id=contact.contact_id) }}" method="POST" style="display:inline;">
                        <button type="submit" style="color: blue; cursor: pointer;">Save</button>
                    </form>
                    | 
                    <a href="{{ url_for('delete_contact', id=contact.contact_id) }}" 
                       onclick="return confirm('Delete this contact?')" style="color: red;">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
