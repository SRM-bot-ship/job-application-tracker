{% extends "base.html" %}

{% block title %}Job Match - Job Tracker{% endblock %}

{% block content %}
<h2>Job Match</h2>

<form method="POST">
    <input type="text" name="skills" placeholder="Enter your skills (comma separated)" required><br>
    <button type="submit">Match Jobs</button>
</form>

<h3>Job Matches</h3>
<ul>
    {% for match in matches %}
        <li>{{ match.title }} - Match Score: {{ match.score }}%</li>
    {% endfor %}
</ul>
{% endblock %}
